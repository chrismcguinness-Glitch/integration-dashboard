<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Performance & KPI Dashboard</title>
<style>
:root{--red:#c8102e;--ink:#161616;--mut:#5f5f5f;--line:#e2e2e2;--bg:#f6f6f6;--ok:#2e7d32;--warn:#b26a00}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 "Segoe UI",system-ui,sans-serif;color:var(--ink);background:var(--bg)}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.top{background:#d61f1d;color:#fff;border-bottom:3px solid #a80f12;padding:8px 22px;position:sticky;top:0;z-index:50}.top .logo{height:44px;width:auto;display:block}
.tright{display:flex;align-items:center;gap:14px}.bell{position:relative;border:2px solid #fff;background:transparent;border-radius:50%;width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}.bell:hover{background:rgba(255,255,255,.15)}.bell:focus-visible{outline:3px solid #fff;outline-offset:2px}
.bell .bdg{position:absolute;top:-6px;right:-6px;background:#fff;color:#c8102e;font-size:11px;font-weight:700;min-width:20px;height:20px;border-radius:10px;padding:0 5px;display:flex;align-items:center;justify-content:center;border:2px solid #c8102e}.bell .bdg.am{color:#8a4f00;border-color:#8a4f00}
.bell.ring svg{animation:ring 2.4s ease-in-out infinite;transform-origin:50% 10%}@keyframes ring{0%,80%,100%{transform:rotate(0)}84%{transform:rotate(14deg)}88%{transform:rotate(-12deg)}92%{transform:rotate(8deg)}96%{transform:rotate(-4deg)}}@media(prefers-reduced-motion:reduce){.bell.ring svg{animation:none}}
nav{top:63px;height:calc(100vh - 63px)}
nav{background:#fff;border-right:1px solid var(--line);padding:16px 0;position:sticky;top:0;height:100vh}
nav h1{font-size:16px;margin:0 16px 14px;line-height:1.2}nav h1 span{color:var(--red)}
nav button{display:block;width:100%;text-align:left;border:0;border-left:4px solid transparent;background:none;padding:9px 16px;font:inherit;cursor:pointer;color:var(--ink)}
nav button:hover{background:var(--bg)}nav button.on{border-left-color:var(--red);font-weight:700;color:var(--red);background:#fff4f5}
main{padding:22px;max-width:1200px;width:100%}h2{margin:0 0 4px;font-size:22px}h3{margin:0 0 10px;font-size:15px;border-left:4px solid var(--red);padding-left:8px}
.sub{color:var(--mut);margin:0 0 16px}.card{background:#fff;border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.stat{background:#fff;border:1px solid var(--line);border-top:3px solid var(--red);padding:12px;border-radius:6px}
.stat b{font-size:26px;display:block}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:3px;flex:1;min-width:140px}
input,select,textarea{font:inherit;color:var(--ink);padding:7px 8px;border:1px solid #bbb;border-radius:4px;background:#fff;width:100%}
textarea{min-height:56px;resize:vertical}:focus-visible{outline:3px solid var(--red);outline-offset:1px}
.btn{background:var(--red);color:#fff;border:1px solid var(--red);padding:8px 14px;border-radius:4px;font:inherit;cursor:pointer;font-weight:600}
.btn.alt{background:#fff;color:var(--ink);border-color:#999}.btn.sm{padding:3px 8px;font-size:12px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:12px;color:var(--mut);background:#fafafa}
.tw{overflow-x:auto}.pill{display:inline-block;padding:1px 9px;border-radius:10px;border:1px solid var(--ink);font-size:12px;white-space:nowrap}
.pill.r{border-color:var(--red);color:var(--red)}.pill.g{border-color:var(--ok);color:var(--ok)}.pill.a{border-color:var(--warn);color:var(--warn)}
.stars{display:inline-flex;gap:2px}.stars button{border:0;background:none;font-size:24px;cursor:pointer;color:#ccc;padding:0 2px;line-height:1}.stars button.f{color:var(--red)}
.cat{border-top:1px solid var(--line);padding:10px 0;display:grid;grid-template-columns:240px 1fr;gap:10px}.cat small{color:var(--mut);display:block}
.def{font-size:12px;color:var(--red);min-height:18px}.empty{color:var(--mut);padding:18px;text-align:center;border:1px dashed #bbb;border-radius:6px}
.note{background:#fff4f5;border-left:4px solid var(--red);padding:8px 12px;margin-bottom:14px;font-size:13px}.flag{color:var(--red);font-weight:700}
.dir{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}.dir button{text-align:left;background:#fff;border:1px solid var(--line);padding:8px;border-radius:6px;cursor:pointer;font:inherit}
.dir button.on{border-color:var(--red);box-shadow:inset 3px 0 var(--red)}
@media(max-width:800px){.app{grid-template-columns:1fr}nav{position:static;height:auto;display:flex;flex-wrap:wrap;padding:8px}nav h1{width:100%}nav button{width:auto;border-left:0;border-bottom:3px solid transparent}nav button.on{border-bottom-color:var(--red)}.cat{grid-template-columns:1fr}}
@media print{.top,nav,.noprint{display:none}.app{display:block}body{background:#fff}}

#toasts{position:fixed;left:16px;bottom:16px;z-index:10001;display:flex;flex-direction:column;gap:8px;width:360px;max-width:calc(100vw - 32px)}
.toast{position:relative;overflow:hidden;background:#161616;color:#fff;border-left:5px solid var(--ok);border-radius:6px;padding:10px 38px 14px 12px;box-shadow:0 6px 18px rgba(0,0,0,.35);animation:tin .2s ease-out}
.toast.err{border-left-color:var(--red)}.toast.warn{border-left-color:#f0a500}.toast.info{border-left-color:#4a90d9}
.toast .tbody{display:flex;flex-direction:column;gap:1px}.toast .tbody b{font-size:12px;text-transform:uppercase;letter-spacing:.5px;opacity:.8}.toast .tbody small{opacity:.65;font-size:11px}
.toast .tx{position:absolute;top:4px;right:6px;border:0;background:none;color:#fff;font-size:20px;line-height:1;cursor:pointer;padding:2px 6px}
.toast i{position:absolute;left:0;bottom:0;height:3px;width:100%;background:rgba(255,255,255,.55);animation:tbar linear forwards}
@keyframes tbar{to{width:0}}@keyframes tin{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10000;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:8px;max-width:480px;width:100%;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.4);max-height:90vh;overflow:auto}
.modal .mbody p{margin:0 0 10px}.modal .mbody ul{margin:0 0 10px;padding-left:20px}.mfoot{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}
@media print{#toasts,.mbg{display:none}}
.ro{background:#f1f1f1;color:var(--mut);cursor:default}
.lnk{border:0;background:none;padding:0;font:inherit;font-weight:700;color:var(--red);text-decoration:underline;text-underline-offset:2px;cursor:pointer}.stat b .lnk,.stat b.lnk{font-size:inherit}
.stat.clk{cursor:pointer}.stat.clk:hover{box-shadow:0 2px 8px rgba(0,0,0,.12)}.stat small.hint{display:block;color:var(--red);font-size:11px}
.dbg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:9998}.drw{position:fixed;top:0;right:0;bottom:0;width:min(580px,100vw);background:#fff;z-index:9999;box-shadow:-8px 0 24px rgba(0,0,0,.25);display:flex;flex-direction:column;animation:din .18s ease-out}
@keyframes din{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.drw .dh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line);border-top:4px solid var(--red)}.drw .dh h3{margin:0}.drw .dh small{color:var(--mut)}
.drw .dx{border:0;background:none;font-size:26px;line-height:1;cursor:pointer;padding:0 4px}.drw .db{overflow:auto;padding:14px 18px;flex:1}
.rec{border:1px solid var(--line);border-left:4px solid var(--red);border-radius:6px;padding:10px 12px;margin-bottom:10px}.rec.m{border-left-color:#1f6fb2}.rec.l2{border-left-color:#b26a00}
.rec h4{margin:0 0 4px;font-size:14px}.kv{display:grid;grid-template-columns:120px 1fr;gap:2px 10px;font-size:13px}.kv span:nth-child(odd){color:var(--mut)}
.tip{background:#f3f8fc;border-left:4px solid #1f6fb2;padding:8px 12px;font-size:13px;margin:8px 0}
details.kb{background:#fff;border:1px solid var(--line);border-radius:6px;padding:10px 14px;margin-bottom:16px}details.kb summary{cursor:pointer;font-weight:700}details.kb p,details.kb li{font-size:13px}
.chart svg .pt{cursor:pointer}.chart svg .pt:hover,.chart svg .pt.sel{stroke:#161616;stroke-width:2.5}.chart svg .pt:focus{outline:none;stroke:#161616;stroke-width:3}
.pdet{border:1px solid var(--line);background:#fafafa;border-radius:6px;padding:10px 12px;margin:8px 0 12px;font-size:13px}.pdet h4{margin:0 0 6px}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin:4px 0}.leg i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:4px}
tr.pick{cursor:pointer}tr.pick:hover td{background:#fff4f5}tr.pick.on td{background:#fff4f5;font-weight:600}
.ins li{margin-bottom:4px}.app.lo{grid-template-columns:1fr}.app.lo nav{display:none}
.stand{border:1px solid var(--line);border-left:6px solid var(--ok);border-radius:6px;padding:10px 12px;margin:10px 0;background:#fff}.stand.a{border-left-color:#f0a500}.stand.r{border-left-color:var(--red)}
.verdict{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px}.verdict b{font-size:16px}.verdict small{color:var(--mut)}.verdict .dot{width:12px;height:12px;border-radius:50%;background:var(--ok);display:inline-block;align-self:center}.stand.a .dot{background:#f0a500}.stand.r .dot{background:var(--red)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px}.sgrid>div{background:#fafafa;border-radius:4px;padding:6px 8px;display:flex;flex-direction:column;font-size:12px}.sgrid small{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.3px}.sgrid b{font-size:18px;line-height:1.3}.sgrid span{color:var(--mut)}
details.acc{background:#fff;border:1px solid var(--line);border-radius:6px;margin-bottom:12px}details.acc>summary{list-style:none;cursor:pointer;padding:14px 16px}details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary .nm{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:700}details.acc>summary .nm small{font-weight:400;color:var(--mut);font-size:13px}
.dar{display:inline-flex;color:var(--red);transition:transform .25s ease}.dar svg{display:block}details.acc:not([open]) .dar{animation:nudge 1.3s ease-in-out infinite}details.acc[open] .dar{transform:rotate(90deg)}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}@media(prefers-reduced-motion:reduce){details.acc:not([open]) .dar{animation:none}}
details.acc>summary:hover .nm>span:not(.dar){color:var(--red)}details.acc>summary:focus-visible{outline:3px solid var(--red);outline-offset:-3px}details.acc .accb{padding:0 16px 14px;border-top:1px solid var(--line)}details.acc>summary .stand{margin-bottom:0}
.hint{font-size:12px;color:var(--red);font-weight:600}
.barrow{display:flex;gap:8px;align-items:center;margin:3px 0;width:100%;border:0;background:none;font:inherit;text-align:left;padding:3px 4px;border-radius:4px;cursor:pointer;color:var(--ink)}.barrow:hover{background:#fff4f5}.barrow[disabled]{cursor:default;background:none}
@media print{details.acc .dar{display:none}}
.up{color:var(--ok);font-weight:700}.dn{color:var(--red);font-weight:700}.tw select{min-width:130px}

.ck{flex-direction:row!important;align-items:center;gap:6px;color:var(--ink)!important;min-width:0!important;flex:none!important;margin:0 12px 4px 0;display:inline-flex!important;font-size:13px!important}.ck input{width:auto}
.scp{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;background:#fafafa;border:1px solid var(--line);border-radius:6px;padding:10px;margin-bottom:10px}.scp b{display:block;font-size:12px;margin-bottom:4px;color:var(--mut)}
.rv{margin-top:12px}.rvhead{display:flex;gap:16px;flex-wrap:wrap;align-items:stretch;margin-bottom:12px}.rvscore{display:flex;flex-direction:column;align-items:flex-start;gap:3px;background:#fff4f5;border:1px solid #f3cfd5;border-radius:8px;padding:10px 18px;min-width:170px}.rvscore b{font-size:34px;line-height:1.1}.rvscore small{color:var(--mut);font-size:12px}.rvmeta{flex:1;min-width:240px}
.hlg{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-bottom:12px}.hlc{border-radius:6px;padding:10px 12px;border:1px solid var(--line);font-size:13px}.hlc.g{background:#eef7ee;border-color:#cfe6d0}.hlc.g>b{color:var(--ok)}.hlc.r{background:#fff4f5;border-color:#f3cfd5}.hlc.r>b{color:var(--red)}.hlc ul{margin:4px 0 0;padding-left:18px}
.rgg{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}.rg{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}.rg header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#fafafa;border-bottom:1px solid var(--line)}.rg header b{flex:1}.rgs{font-size:20px;font-weight:700}.rgs small{font-size:11px;color:var(--mut);font-weight:400}
.rc{padding:8px 12px;border-bottom:1px solid var(--line);border-left:4px solid transparent}.rc:last-child{border-bottom:0}.rc.lo{border-left-color:var(--red);background:#fffafa}.rc.hi{border-left-color:var(--ok)}.rch{display:flex;align-items:center;gap:8px}.rch>span:first-child{flex:1;font-size:13px}.rstars{color:#e8a200;letter-spacing:1px;font-size:15px;white-space:nowrap}.rstars i{color:#ddd;font-style:normal}.rn{min-width:14px;text-align:right;font-size:15px}
details.ev>summary{cursor:pointer;font-size:12px;color:var(--red);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}details.ev>summary span{color:var(--mut);font-weight:400}details.ev[open]>summary span{display:none}details.ev p{margin:4px 0 0;font-size:13px;white-space:pre-wrap}details.ev ul{font-size:13px;margin:6px 0}
.sumg{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:12px}.sumc{background:#fafafa;border-radius:6px;padding:8px 12px;border-top:3px solid #bbb}.sumc.g{border-top-color:var(--ok)}.sumc.r{border-top-color:var(--red)}.sumc small{color:var(--mut);text-transform:uppercase;font-size:11px;letter-spacing:.3px}.sumc p{margin:2px 0 0;font-size:13px;white-space:pre-wrap}
.actl{display:flex;flex-direction:column;gap:8px}.actr{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:#fff;border:1px solid var(--line);border-radius:6px;padding:10px 12px;font:inherit;color:var(--ink);cursor:pointer}.actr:hover,.actr:focus-visible{border-color:var(--red);background:#fff9f9}.av{width:36px;height:36px;border-radius:50%;background:#fde3e3;color:var(--red);font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none;font-size:13px}.actr .ai{flex:1;min-width:0}.actr .ai small{display:block;color:var(--mut);font-size:12px}.actr .as{text-align:right;flex:none}.actr .as b{font-size:20px;display:block}
.rkg{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:12px}.rkc{border:1px solid var(--line);border-top:4px solid #f0a500;border-radius:8px;padding:12px;background:#fff}.rkc.h{border-top-color:var(--red)}.rkc.l{border-top-color:#8a8a8a}.rkc p{margin:6px 0;font-size:13px}
.rkh{display:flex;gap:10px;align-items:center}.rkh>div{flex:1;min-width:0}.rkh small{display:block;color:var(--mut)}.pri{font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;background:#fde7c2;color:#8a4f00;white-space:nowrap}.pri.h{background:#f9d0d6;color:#a80f12}.pri.l{background:#eee;color:#555}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 4px}.chip{font-size:11px;padding:2px 8px;border-radius:10px;border:1px solid #ccc;background:#fafafa}
.rkm{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}.rkm>div{background:#fafafa;border-radius:4px;padding:4px 8px}.rkm small{display:block;font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.3px}.rkm b{font-size:16px}
.prog{height:8px;background:#eee;border-radius:4px;overflow:hidden;min-width:80px;margin:4px 0 2px}.prog i{display:block;height:100%;background:var(--ok)}.prog.a i{background:#f0a500}.prog.r i{background:var(--red)}
.tlsum{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;padding-left:30px}.tlsum .prog{width:120px;margin:0}.tlsum small{color:var(--mut)}
.legc{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}.legc button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:14px;padding:3px 10px;font:inherit;font-size:12px;cursor:pointer;color:var(--ink)}.legc button:hover{border-color:#999}.legc button i{width:18px;height:4px;border-radius:2px;display:inline-block}.legc button.off{opacity:.45;text-decoration:line-through}.chart svg .hide{display:none}
.chd{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:8px}.chd>div{background:#fafafa;border-radius:6px;padding:8px 10px}.chd small{display:block;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.3px}.chd b{font-size:20px}
ul.chk{list-style:none;padding:0;margin:0}ul.chk li{padding:4px 0 4px 26px;position:relative;font-size:13px}ul.chk li:before{position:absolute;left:0;top:3px;width:18px;height:18px;border-radius:50%;text-align:center;line-height:18px;font-size:12px;font-weight:700;color:#fff}ul.chk li.ok:before{content:"✓";background:var(--ok)}ul.chk li.wn:before{content:"!";background:#f0a500}
@media(max-width:800px){.tlsum{padding-left:0}}
@media(max-width:600px){main{padding:12px}.rgg,.rkg{grid-template-columns:1fr}.kv{grid-template-columns:96px 1fr}.rkm{grid-template-columns:repeat(2,1fr)}.top{padding:8px 12px}.top .logo{height:34px}.card{padding:12px}.stat b{font-size:22px}.actr .as b{font-size:16px}}
@media print{details.ev>summary span{display:none}}

function inrTot(list){let t=0;const miss=new Set();list.forEach(l=>{const r=l.cur=="INR"?1:+((S.fx||{})[l.cur]);if(r>0)t+=l.amt*r;else miss.add(l.cur)});return{t,miss:[...miss],n:list.length,fx:list.filter(l=>l.cur!="INR")}}

function plist(k){const now=k=="m"?ym(new Date()):monday(new Date()),ds=[...Object.values(RS(k)).map(pd),...S.mails.map(x=>x.date),...S.losses.map(x=>x.date),...S.kpis.map(x=>x.period)].filter(Boolean).map(d=>k=="m"?d.slice(0,7):(d.length==10?monday(d):null)).filter(Boolean);
let lo=pidx(k=="m"?addM(now,-12):addD(now,-7*26)),hi=pidx(k=="m"?addM(now,2):addD(now,14));ds.forEach(d=>{const i=pidx(d);if(i<lo)lo=i;if(i>hi)hi=i});const o=[];for(let i=hi;i>=lo;i--)o.push(pof(i,k));return o}

const rangeTxt=(k,R)=>R.from||R.to?`Showing ${R.from?E(longP(R.from,k)):"the earliest review"} to ${R.to?E(longP(R.to,k)):"the latest review"}.`:"Showing all reviews.";
/* At-a-glance standing of an agent for one review period */
function standing(r,k){const per=pd(r),m=avg(r).m,pv=prevRev(r.agent,per,k),pm=pv?avg(pv).m:null,d=pm!=null&&m!=null?m-pm:null,same=Object.values(RS(k)).filter(x=>pd(x)==per&&agent(x.agent)&&avg(x).m!=null),tav=same.length?mean(same.map(x=>avg(x).m)):null,rank=same.filter(x=>avg(x).m>m).length+1;
const hist=revs(r.agent,k).filter(x=>pd(x)<=per&&avg(x).m!=null).slice(-4),hv=hist.map(x=>avg(x).m),tr=hv.length>=2?hv[hv.length-1]-hv[0]:null,fl=CATS.filter(c=>r.ratings[c.id]&&r.ratings[c.id]<=2),td=tdy(),oa=S.log.filter(l=>l.agent==r.agent&&l.action&&!l.done),od=oa.filter(l=>l.due&&l.due<td),ls=S.losses.filter(x=>x.agent==r.agent&&inPer(x.date,per,k)),em=S.mails.filter(x=>x.agent==r.agent&&inPer(x.date,per,k)),fall3=hv.length>=3&&hv[hv.length-1]<hv[hv.length-2]&&hv[hv.length-2]<hv[hv.length-3];
let v,c,why=[];if(m<BT[1]||fall3||avg(r).crit.length||(d!=null&&d<=-.3&&fl.length>=3)){v="At risk";c="r"}else if((d!=null&&d<=-.3)||fl.length||od.length||ls.length){v="Needs attention";c="a"}else if(m>=BT[2]){v="Strong performer";c="g"}else{v="On track";c="g"}
if(m<BT[1])why.push("score below the Meets band ("+pc(m)+")");if(avg(r).crit.length)why.push("critical fail: "+avg(r).crit.map(c=>c.n).join(", ")+" rated 1");if(fall3)why.push("score fell across the last 3 reviews");if(d!=null&&d<=-.3)why.push("dropped "+Math.abs(d).toFixed(2)+" since "+PL(pv));if(d!=null&&d>=.3)why.push("up +"+d.toFixed(2)+" since "+PL(pv));if(fl.length)why.push(fl.length+" categor"+(fl.length==1?"y":"ies")+" rated 1-2");if(od.length)why.push(od.length+" overdue action"+(od.length==1?"":"s"));if(ls.length)why.push(ls.length+" loss record"+(ls.length==1?"":"s")+" this "+PU(k));const oc=opsCalc(opsOf(r.agent,per.slice(0,7)));if(oc&&oc.miss.length)why.push("ops: "+oc.miss.map(z=>z[1].toLowerCase()+" "+fmtO(z[0],oc[z[0]])+" (target "+(z[3]=="higher"?"≥":"≤")+S.opsT[z[0]]+z[2]+")").join(", "));if(oc&&oc.rag!="g"&&v=="On track"){v="Needs attention";c="a"}if(oc&&oc.rag!="g"&&v=="Strong performer"){v="Needs attention";c="a"}if(!why.length)why.push(tav!=null&&m>=tav?"at or above the team average":"no warning signs this "+PU(k));
const ar=x=>x==null?"":x>=.3?"▲":x<=-.3?"▼":"►",cl=x=>x==null?"":x>=.3?"up":x<=-.3?"dn":"";
return{v,c,why,html:`<div class="stand ${c}"><div class="verdict"><span class="dot"></span><b>${v}</b><small>${E(why.join("; "))}</small></div><div class="sgrid"><div><small>Score</small><b>${f2(m)}</b>${pill(m)}</div><div><small>vs previous</small><b class="${cl(d)}">${d==null?"–":(d>0?"+":"")+d.toFixed(2)+" "+ar(d)}</b><span>${pv?E(PL(pv))+": "+f2(pm):"first review"}</span></div><div><small>vs team</small><b class="${tav!=null&&m-tav>=.3?"up":tav!=null&&m-tav<=-.3?"dn":""}">${tav==null?"–":(m-tav>0?"+":"")+(m-tav).toFixed(2)}</b><span>rank ${rank} of ${same.length} · avg ${f2(tav)}</span></div><div><small>Trend (last ${hv.length})</small><b>${spark(hv)}</b><span class="${cl(tr)}">${tr==null?"not enough data":tr>=.3?"Improving":tr<=-.3?"Declining":"Stable"}</span></div><div><small>Red flags</small><b class="${fl.length?"dn":""}">${fl.length}</b><span>${fl.length?E(fl.slice(0,3).map(c=>c.n).join(", "))+(fl.length>3?"…":""):"none"}</span></div><div><small>Open actions</small><b class="${od.length?"dn":""}">${dlink(oa.length,"Open coaching actions: "+nm(r.agent),"log",oa.map(l=>l.id))}</b><span>${od.length?od.length+" overdue":"none overdue"}</span></div><div><small>Ops index</small><b style="${oc?"color:"+(oc.rag=="g"?"var(--ok)":oc.rag=="a"?"#b26a00":"var(--red)"):""}">${oc&&oc.idx!=null?oc.idx.toFixed(0):"–"}</b><span>${oc?(oc.miss.length?oc.miss.length+" target"+(oc.miss.length==1?"":"s")+" missed":"all targets met"):"no ops data"}</span></div><div><small>Emails / losses</small><b>${dlink(em.length,"Email records: "+nm(r.agent)+", "+longP(per,k),"mail",em.map(x=>x.id))} / ${dlink(ls.length,"Loss records: "+nm(r.agent)+", "+longP(per,k),"loss",ls.map(x=>x.id))}</b><span>${ls.length?fmtSums(lossSum(ls)):"no loss"}</span></div></div></div>`}}

function scoringCard(){const sc=S.sc,tot=G.reduce((t,g)=>t+(+sc.gw[g[0]]||0),0);
return `<div class="card"><h3>Scoring model (QA scorecard)</h3><p class="sub">This follows common contact-centre QA practice. The overall score is weighted by group, shown as a percentage. Critical categories trigger an automatic fail when rated 1 star. It applies to every saved review, so trends compare like with like; switch to Simple average to see the old method.</p>
<div class="row"><label style="flex:none;min-width:240px">Method<select onchange="A.scSet('model',this.value)"><option value="weighted" ${sc.model=="weighted"?"selected":""}>Weighted QA score (recommended)</option><option value="simple" ${sc.model=="simple"?"selected":""}>Simple average (previous method)</option></select></label><label style="flex:none;min-width:260px">Critical category rated 1 star<select onchange="A.scSet('rule',this.value)"><option value="cap" ${sc.rule=="cap"?"selected":""}>Auto-fail: cap the review in Unsatisfactory</option><option value="flag" ${sc.rule=="flag"?"selected":""}>Flag only, do not change the score</option></select></label></div>
<div class="tw"><table><tr><th>Group</th><th>Weight %</th><th>Categories</th><th>Critical (a 1-star rating fails the review)</th></tr>${G.map(g=>`<tr><td><b>${g[0]}. ${E(g[1])}</b></td><td><input type="number" min="0" max="100" step="1" value="${+sc.gw[g[0]]||0}" style="max-width:80px" onchange="A.scW('${g[0]}',this.value)" aria-label="Weight for ${E(g[1])}"></td><td>${CATS.filter(c=>c.g==g[0]).length}</td><td>${CATS.filter(c=>c.g==g[0]).map(c=>`<label style="flex-direction:row;align-items:center;display:inline-flex;min-width:0;margin:0 10px 4px 0;color:var(--ink)"><input type="checkbox" style="width:auto" ${sc.crit[c.id]?"checked":""} onchange="A.scC('${c.id}',this.checked)"> ${E(c.n)}</label>`).join("")}</td></tr>`).join("")}<tr><td><b>Total</b></td><td class="${tot==100?"":"flag"}"><b>${tot}%</b></td><td colspan="2" class="sub">${tot==100?"Weights add up to 100%.":"Weights should add up to 100%. They are used as proportions, so the score is still correct, but 100% is easier to read."}</td></tr></table></div>
<p class="sub" style="margin-top:8px">How a review is scored: each group's average star rating is multiplied by the group weight. Groups with no ratings are left out and the remaining weights are scaled up. The result (1 to 5) converts to a percentage: 5 stars = 100%. Bands: ${BN.map((b,i)=>b+" "+BP[i]).join("; ")}. A 0.30 change on the 1 to 5 scale is about 6 percentage points.</p><button class="btn alt sm" data-a="scReset">Restore recommended defaults</button></div>`}

<details class="kb"><summary>Guidance: what these measures mean and typical contact-centre benchmarks</summary><ul><li><b>Schedule adherence</b>: time the agent was in the right state (available, on break, in training) at the scheduled time, as a % of scheduled time. Typical target 90-95%. Take it from your WFM or telephony report.</li><li><b>Break adherence</b>: breaks and lunches taken on time and within the allowed length. Typical target 95%+. Repeated overruns usually point to workload or habits worth a 1:1 conversation.</li><li><b>Attendance</b>: days present ÷ scheduled days. Typical target 95%+. Look at patterns (Mondays, after weekends) rather than single days, and follow your leave policy.</li><li><b>Shrinkage</b>: paid time when the agent is not available for customer work (leave, absence, training, meetings, coaching). 30-35% is common for contact centres. High <i>unplanned</i> absence is the part to act on; planned leave and training are healthy.</li><li><b>Late logins</b>: count of shifts started late. A small number is normal; a rising trend is the signal.</li><li><b>Occupancy</b> (optional): time handling contacts ÷ available time. 75-85% is healthy; above 90% for long periods risks burnout.</li><li><b>Read together</b>: low adherence with high quality scores can mean an agent is taking extra time to do the job well. Check before treating it as a conduct issue.</li></ul></details>`}
